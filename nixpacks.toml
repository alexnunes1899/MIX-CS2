[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = ["npm ci --prefer-offline --no-audit --no-fund"]

[phases.build]
cmds = ["node -e \"if (!require('fs').existsSync('dist/index.html')) require('child_process').execSync('npm run build', {stdio: 'inherit'})\""]

[start]
cmd = "npm start"
